[package]
name = "orchester-desktop"
description = "Native desktop shell for Orchester"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dieWehmut/Orchester"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
orchester-anwendung = { path = "../../../kisten/anwendung" }
orchester-laufzeit = { path = "../../../kisten/laufzeit" }
orchester-netz = { path = "../../../kisten/netz", features = ["static-files"] }

[dev-dependencies]
serde_json = "1"

# Keep the desktop crate independent from the repository's Rust workspace.
[workspace]
