[package]
name = "orchester-netz"
description = "Loopback HTTP and WebSocket service for Orchester frontends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
static-files = ["tower-http/fs"]

[dependencies]
axum = { workspace = true, features = ["query"] }
cookie = "0.18.2"
getrandom = { workspace = true }
mime_guess = "2"
orchester-anwendung = { workspace = true }
orchester-laufzeit = { workspace = true }
orchester-protokoll = { workspace = true }
orchester-vertrag = { workspace = true }
orchester-verzeichnis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tokio-tungstenite = "0.29"
