name: npm-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version pinned across the Rust and npm packages
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.96.1"
  NODE_VERSION: "24.8.0"
  NPM_VERSION: "11.18.0"

concurrency:
  group: npm-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the pinned version and existing tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ $(node -p "require('./npm/cli/package.json').version") == "$VERSION" ]]

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = process.env.VERSION;
          const cli = JSON.parse(fs.readFileSync('npm/cli/package.json', 'utf8'));
          for (const [name, pinned] of Object.entries(cli.optionalDependencies ?? {})) {
            if (pinned !== version) throw new Error(`${name} is pinned to ${pinned}, not ${version}`);
          }
          for (const directory of fs.readdirSync('npm/plugins')) {
            const plugin = JSON.parse(fs.readFileSync(`npm/plugins/${directory}/package.json`, 'utf8'));
            if (plugin.version !== version) {
              throw new Error(`${plugin.name} is pinned to ${plugin.version}, not ${version}`);
            }
          }
          NODE

          cargo metadata --locked --no-deps --format-version 1 |
            node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const metadata=JSON.parse(body); const expected=process.env.VERSION; for (const package of metadata.packages) if (package.version !== expected) throw new Error(`${package.name} is ${package.version}, not ${expected}`); });'

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if ! git diff --quiet "$TAG_COMMIT" "$GITHUB_SHA" -- . ':!.github/workflows/npm-release.yml' ':!werkzeug/npm/release-workflow.test.mjs'; then
              echo "existing $TAG differs from the release commit outside npm-release.yml" >&2
              exit 1
            fi
          fi

  test:
    name: Test release source
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pinned release tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" clippy
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          [[ $(npm --version) == "$NPM_VERSION" ]]

      - name: Test Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test --locked --workspace --all-targets
          cargo +"$RUST_TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings

      - name: Test npm distribution tools
        shell: bash
        run: node --test npm/cli/test/*.test.cjs werkzeug/npm/*.test.mjs

  build:
    name: Build ${{ matrix.package }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cli-linux-x64
            runner: ubuntu-24.04
            family: posix
            rust_target: x86_64-unknown-linux-musl
            binary: orchester
          - package: cli-linux-arm64
            runner: ubuntu-24.04-arm
            family: posix
            rust_target: aarch64-unknown-linux-musl
            binary: orchester
          - package: cli-darwin-x64
            runner: macos-15-intel
            family: posix
            rust_target: x86_64-apple-darwin
            binary: orchester
          - package: cli-darwin-arm64
            runner: macos-15
            family: posix
            rust_target: aarch64-apple-darwin
            binary: orchester
          - package: cli-win32-x64
            runner: windows-2025
            family: windows
            rust_target: x86_64-pc-windows-msvc
            binary: orchester.exe
          - package: cli-win32-arm64
            runner: windows-11-arm
            family: windows
            rust_target: aarch64-pc-windows-msvc
            binary: orchester.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build POSIX native archive
        if: matrix.family == 'posix'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          BINARY: ${{ matrix.binary }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$RUST_TARGET"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes musl-tools
          fi
          cargo +"$RUST_TOOLCHAIN" build --locked --release --target "$RUST_TARGET" -p orchester-konsole
          mkdir -p "bundle/$RUST_TARGET/release"
          cp "target/$RUST_TARGET/release/$BINARY" "bundle/$RUST_TARGET/release/$BINARY"
          chmod 0755 "bundle/$RUST_TARGET/release/$BINARY"
          tar -C bundle -czf "native-$PACKAGE.tar.gz" "$RUST_TARGET/release/$BINARY"

      - name: Build Windows native archive
        if: matrix.family == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          BINARY: ${{ matrix.binary }}
          PACKAGE: ${{ matrix.package }}
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup target add --toolchain $env:RUST_TOOLCHAIN $env:RUST_TARGET
          cargo "+$env:RUST_TOOLCHAIN" build --locked --release --target $env:RUST_TARGET -p orchester-konsole
          $destination = Join-Path "bundle" "$env:RUST_TARGET/release"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath "target/$env:RUST_TARGET/release/$env:BINARY" -Destination $destination
          tar -C bundle -czf "native-$env:PACKAGE.tar.gz" "$env:RUST_TARGET/release/$env:BINARY"
          if ($LASTEXITCODE -ne 0) { throw "failed to archive $env:RUST_TARGET" }

      - name: Upload immutable native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.package }}.tar.gz
          path: native-${{ matrix.package }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage and verify release archives
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pinned npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          [[ $(npm --version) == "$NPM_VERSION" ]]

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: native-archives
          pattern: native-*
          merge-multiple: true

      - name: Stage, verify, and pack release archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir artifact-root
          archives=(native-archives/native-*.tar.gz)
          [[ ${#archives[@]} -eq 6 ]]
          for archive in "${archives[@]}"; do
            tar -xzf "$archive" -C artifact-root
          done

          node werkzeug/npm/stage.mjs \
            --artifacts artifact-root \
            --output staged \
            --version "$VERSION"

          mapfile -t platform_dirs < <(find staged -mindepth 1 -maxdepth 1 -type d -print | sort)
          [[ ${#platform_dirs[@]} -eq 6 ]]
          verify_args=()
          for directory in "${platform_dirs[@]}"; do
            verify_args+=(--platform-dir "$directory")
          done
          node werkzeug/npm/verify.mjs --meta npm/cli "${verify_args[@]}"
          node werkzeug/npm/plugin-release.mjs --version "$VERSION"

          mapfile -t plugin_dirs < <(find npm/plugins -mindepth 1 -maxdepth 1 -type d -print | sort)
          [[ ${#plugin_dirs[@]} -eq 3 ]]

          mkdir release
          npm pack --ignore-scripts --pack-destination release ./npm/cli >/dev/null
          for directory in "${platform_dirs[@]}"; do
            npm pack --ignore-scripts --pack-destination release "./$directory" >/dev/null
          done
          for directory in "${plugin_dirs[@]}"; do
            npm pack --ignore-scripts --pack-destination release "./$directory" >/dev/null
          done
          [[ $(find release -maxdepth 1 -type f -name '*.tgz' | wc -l) -eq 10 ]]
          (cd release && sha256sum *.tgz > SHA256SUMS)
          tar -C release -czf npm-release.tar.gz .

      - name: Upload verified release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release.tar.gz
          path: npm-release.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  tag:
    name: Tag v${{ inputs.version }}
    needs: [stage, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create and push the release tag
        shell: bash
        env:
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
                if ! git diff --quiet "$TAG_COMMIT" "$GITHUB_SHA" -- . ':!.github/workflows/npm-release.yml' ':!werkzeug/npm/release-workflow.test.mjs'; then
              echo "existing $TAG differs from the release commit outside npm-release.yml" >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$GITHUB_SHA" -m "Orchester $TAG"
          git push origin "refs/tags/$TAG"

  publish:
    name: Publish npm packages
    needs: stage
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node for npm publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pinned npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          [[ $(npm --version) == "$NPM_VERSION" ]]

      - name: Download verified release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-release.tar.gz
          path: .

      - name: Publish packages in dependency order
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release
          tar -xzf npm-release.tar.gz -C release
          (cd release && sha256sum --check SHA256SUMS)
          [[ $(npm config get registry) == "https://registry.npmjs.org/" ]]

          published_version() {
            npm view "$1@$VERSION" version 2>/dev/null || true
          }

          wait_for_version() {
            local package="$1"
            for attempt in {1..30}; do
              if [[ $(published_version "$package") == "$VERSION" ]]; then
                return 0
              fi
              sleep 10
            done
            echo "npm registry did not expose $package@$VERSION in time" >&2
            return 1
          }

          publish_package() {
            local package="$1"
            local archive="${package#@}"
            archive="${archive//\//-}-$VERSION.tgz"
            test -f "release/$archive"
            if [[ $(published_version "$package") == "$VERSION" ]]; then
              echo "$package@$VERSION is already published"
              return 0
            fi
            npm publish "./release/$archive" --access public --provenance --ignore-scripts
            wait_for_version "$package"
          }

          mapfile -t platform_packages < <(
            node -e "for (const name of Object.keys(require('./npm/cli/package.json').optionalDependencies)) console.log(name)"
          )
          [[ ${#platform_packages[@]} -eq 6 ]]
          node werkzeug/npm/plugin-release.mjs --version "$VERSION"
          mapfile -t plugin_packages < <(
            node --input-type=module -e "import { OFFICIAL_AGENT_PLUGINS as names } from './werkzeug/npm/plugin-release.mjs'; for (const name of names) console.log('@orchester/' + name)"
          )
          [[ ${#plugin_packages[@]} -eq 3 ]]

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            unset NODE_AUTH_TOKEN
            for package in "${platform_packages[@]}" "${plugin_packages[@]}" "@orchester/cli"; do
              if ! npm view "$package" name >/dev/null 2>&1; then
                echo "NPM_TOKEN is required to bootstrap $package; publish v0.1.0 once with a granular npm token, then configure npm Trusted Publishing for this workflow" >&2
                exit 1
              fi
            done
          fi

          for package in "${platform_packages[@]}"; do
            publish_package "$package"
          done
          for package in "${plugin_packages[@]}"; do
            publish_package "$package"
          done
          publish_package "@orchester/cli"

  release:
    name: Create GitHub Release
    needs: [stage, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified npm archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-release.tar.gz
          path: .

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: native-archives
          pattern: native-*
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          tar -xzf npm-release.tar.gz -C release
          (cd release && sha256sum --check SHA256SUMS)
          cp native-archives/native-*.tar.gz release/
          (cd release && sha256sum *.tgz native-*.tar.gz > SHA256SUMS)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* npm-release.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* npm-release.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Orchester $TAG" \
              --generate-notes
          fi

  verify:
    name: Verify published release
    needs: [publish, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm and GitHub publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            node --input-type=module -e '
              import fs from "node:fs";
              const cli = JSON.parse(fs.readFileSync("npm/cli/package.json", "utf8"));
              for (const name of Object.keys(cli.optionalDependencies)) console.log(name);
              for (const directory of fs.readdirSync("npm/plugins")) {
                const manifest = JSON.parse(fs.readFileSync("npm/plugins/" + directory + "/package.json", "utf8"));
                console.log(manifest.name);
              }
              console.log(cli.name);
            '
          )
          [[ ${#packages[@]} -eq 10 ]]
          for package in "${packages[@]}"; do
            [[ $(npm view "$package@$VERSION" version) == "$VERSION" ]]
          done
          [[ $(npm view "@orchester/cli@$VERSION" version) == "$VERSION" ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == env.TAG and .isDraft == false and .isPrerelease == false)'
