name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - apps/website/**
      - apps/design/**
      - apps/package.json
      - apps/pnpm-lock.yaml
      - apps/pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.8.0"
  PNPM_VERSION: "10.32.1"
  BASE_PATH: /Orchester/

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts
          [[ $(pnpm --version) == "$PNPM_VERSION" ]]

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5

      - name: Install dependencies
        shell: bash
        run: pnpm --dir apps install --frozen-lockfile

      - name: Typecheck website
        shell: bash
        run: pnpm --dir apps --filter @orchester/website typecheck

      - name: Test website
        shell: bash
        run: pnpm --dir apps --filter @orchester/website test

      - name: Build website
        shell: bash
        run: pnpm --dir apps --filter @orchester/website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v4
        with:
          path: apps/website/dist

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4
